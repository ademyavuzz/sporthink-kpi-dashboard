name: sporthink-dev

services:
  mysql:
    image: mysql:8.4
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sporthink_dashboard}
      MYSQL_USER: ${MYSQL_USER:-sporthink}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sporthink_dev_pw}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_pw}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sporthink

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sporthink

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./sporthink_dummy_data:/seed_data:ro
      - backend_uploads:/var/sporthink/uploads
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      APP_ENV: development
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-sporthink}:${MYSQL_PASSWORD:-sporthink_dev_pw}@mysql:3306/${MYSQL_DATABASE:-sporthink_dashboard}
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_BROKER_URL: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production-this-must-be-at-least-64-characters-long}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      FRONTEND_ORIGIN: http://localhost:5173
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@sporthink.local}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@sporthink.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-ChangeMe!1234567890}
      UPLOAD_DIR: /var/sporthink/uploads
      SEED_DATA_DIR: /seed_data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sporthink

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      APP_ENV: development
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-sporthink}:${MYSQL_PASSWORD:-sporthink_dev_pw}@mysql:3306/${MYSQL_DATABASE:-sporthink_dashboard}
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_BROKER_URL: redis://redis:6379/1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sporthink

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - sporthink

volumes:
  mysql_data:
  redis_data:
  backend_uploads:

networks:
  sporthink:
    driver: bridge
