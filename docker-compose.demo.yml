# Demo override — `docker compose -f docker-compose.dev.yml -f docker-compose.demo.yml up -d`
# ngrok tunnel ile public URL açar. Production değil, sunum amaçlı.
#
# Farklar (dev → demo):
# - Backend uvicorn --reload yerine prod modda (tek worker, no reload)
# - Frontend Vite dev server yerine prebuilt dist Nginx serve eder
# - Reverse proxy nginx eklenir (frontend + /api/ same-origin)
# - ngrok agent container (proxy nginx:80'i tunnel eder)

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-sporthink}:${MYSQL_PASSWORD:-sporthink_dev_pw}@mysql:3306/${MYSQL_DATABASE:-sporthink_dashboard}
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_BROKER_URL: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sporthink Dashboard}
      INVITE_TOKEN_EXPIRE_HOURS: ${INVITE_TOKEN_EXPIRE_HOURS:-168}
      RESET_TOKEN_EXPIRE_MINUTES: ${RESET_TOKEN_EXPIRE_MINUTES:-60}
      UPLOAD_DIR: /var/sporthink/uploads
      SEED_DATA_DIR: /seed_data

  frontend:
    # Dev image yerine static nginx (build edilmiş dist'i serve eder)
    image: nginx:1.27-alpine
    build: !reset null
    command: ["nginx", "-g", "daemon off;"]
    ports: !reset []
    expose:
      - "80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
    environment: !reset {}
    networks:
      - sporthink

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sporthink

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "--domain=${NGROK_DOMAIN}"
      - "proxy:80"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - proxy
    networks:
      - sporthink
