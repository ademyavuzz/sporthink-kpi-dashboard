# `dashboard.sporthink.com.tr` reverse proxy — frontend (static SPA) + /api proxy.
# Let's Encrypt webroot ile renewal.

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.sporthink.com.tr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — production
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.sporthink.com.tr;

    ssl_certificate /etc/nginx/certs/live/dashboard.sporthink.com.tr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/dashboard.sporthink.com.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API: backend'e proxy + login için stricter rate limit
    location /api/v1/auth/login {
        limit_req zone=api_login burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_general burst=120 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend: SPA — fallback to index.html for client-side routing
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
