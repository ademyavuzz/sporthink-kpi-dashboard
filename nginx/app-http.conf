# HTTP-only reverse proxy — domain/SSL gelmeden once (Faz 1: IP uzerinden erisim)
# ve Let's Encrypt webroot bootstrap'i icin. server_name `_` oldugu icin hem IP
# hem de henuz dogrulanmamis domain ile calisir.
#
# Domain + SSL hazir olunca .env'de NGINX_CONF=./nginx/sporthink.conf yapilip
# `docker compose ... up -d nginx` ile HTTPS config'e gecilir.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 60M;

    # Security headers (HSTS yok — henuz HTTPS yok)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt ACME challenge (Faz 2 sertifika alimi icin hazir)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Login — stricter rate limit (zone nginx.conf'ta tanimli)
    location /api/v1/auth/login {
        limit_req zone=api_login burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API -> backend
    location /api/ {
        limit_req zone=api_general burst=120 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Avatar / upload statikleri -> backend
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA -> static nginx (try_files fallback orada)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
