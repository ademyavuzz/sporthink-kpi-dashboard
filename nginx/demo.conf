# Demo reverse proxy — ngrok tunnel için (HTTP only, SSL ngrok tarafında).
# Frontend static + /api/ → backend proxy. Same-origin, CORS preflight yok.

server {
    listen 80 default_server;
    server_name _;

    # ngrok HTTPS terminate ediyor; gerçek scheme bu header'da geliyor.
    set $real_scheme $http_x_forwarded_proto;
    if ($real_scheme = "") {
        set $real_scheme $scheme;
    }

    client_max_body_size 60M;

    # API → backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 120s;
    }

    # Avatar/upload statikleri
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    # Frontend SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }
}
