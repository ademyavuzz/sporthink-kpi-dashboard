# Static SPA serve — production build (frontend/dist).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Asset caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /locales/ {
        # Translation dosyaları — kısa cache (deploy sonrası fresh)
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # SPA fallback — React Router için
    location / {
        try_files $uri $uri/ /index.html;
    }
}
